name: Version and release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/verify.yml

  version:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Require public release configuration
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_KEY"
          test -n "$EAS_PROJECT"
        env:
          SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EAS_PROJECT: ${{ vars.EXPO_PUBLIC_EAS_PROJECT_ID }}
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        id: release
        with:
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-macos:
    needs: [verify, version]
    if: needs.version.outputs.released == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Require configured builds from the released commit
        run: |
          test "$RELEASE_SHA" = "$GITHUB_SHA"
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_KEY"
          test -n "$EAS_PROJECT"
        env:
          RELEASE_SHA: ${{ needs.version.outputs.sha }}
          SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EAS_PROJECT: ${{ vars.EXPO_PUBLIC_EAS_PROJECT_ID }}
      - name: Download this run's verified Mac artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern 'macos-*' --dir artifacts
      - name: Attach Mac test apps and checksums to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: gh release upload "$RELEASE_TAG" artifacts/macos-*/* --repo "$GITHUB_REPOSITORY" --clobber
