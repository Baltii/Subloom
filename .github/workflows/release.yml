name: Version and release

on:
  push:
    branches: [release-candidate]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-production
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/release-candidate'
    uses: ./.github/workflows/verify.yml
    secrets:
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}

  version:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      released: ${{ steps.publication.outputs.released }}
      tag: ${{ steps.publication.outputs.tag }}
      sha: ${{ steps.publication.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Require public release configuration
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_KEY"
          test -n "$EAS_PROJECT"
        env:
          SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EAS_PROJECT: ${{ vars.EXPO_PUBLIC_EAS_PROJECT_ID }}
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          target-branch: release-candidate
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Resolve publication, including an already published release
        id: publication
        run: node scripts/resolve-release-publication.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          CREATED_RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
          CREATED_RELEASE_SHA: ${{ steps.release.outputs.sha }}

  publish-artifacts:
    needs: [verify, version]
    if: needs.version.outputs.released == 'true'
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/release-assets.yml
    with:
      tag: ${{ needs.version.outputs.tag }}
      # Reuse the current run only when its verified commit is the release.
      # Historical releases are rebuilt at their exact tag instead.
      reuse_verified: ${{ needs.version.outputs.sha == github.sha }}
    secrets:
      SUBLOOM_UPDATE_SIGNING_SEED: ${{ secrets.SUBLOOM_UPDATE_SIGNING_SEED }}
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
