name: Version and release

on:
  push:
    branches: [release-candidate]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-production
  cancel-in-progress: false

jobs:
  version:
    name: Prepare release PR or resolve merged release
    if: github.ref == 'refs/heads/release-candidate'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      released: ${{ steps.publication.outputs.released }}
      tag: ${{ steps.publication.outputs.tag }}
      sha: ${{ steps.publication.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          target-branch: release-candidate
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true
      - name: Resolve this release commit, including a draft from a previous attempt
        id: publication
        run: node scripts/resolve-release-publication.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          CREATED_RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
          CREATED_RELEASE_SHA: ${{ steps.release.outputs.sha }}
          ALLOW_DRAFT_RELEASE: 'true'
      - name: Prepare the next release PR only after draft/tag resolution
        if: steps.publication.outputs.released != 'true' && steps.publication.outputs.pending != 'true'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          target-branch: release-candidate
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true

  verify:
    needs: version
    if: needs.version.outputs.released == 'true'
    uses: ./.github/workflows/verify.yml
    with:
      ref: ${{ needs.version.outputs.sha }}
      build_installers: true
    secrets:
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}

  publish-artifacts:
    needs: [verify, version]
    if: needs.version.outputs.released == 'true'
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/release-assets.yml
    with:
      tag: ${{ needs.version.outputs.tag }}
      reuse_verified: ${{ needs.version.outputs.sha == github.sha }}
    secrets:
      SUBLOOM_UPDATE_SIGNING_SEED: ${{ secrets.SUBLOOM_UPDATE_SIGNING_SEED }}
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
