name: Version and release

on:
  push:
    branches: [release-candidate]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-production
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/release-candidate'
    uses: ./.github/workflows/verify.yml
    secrets:
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}

  version:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Require public release configuration
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_KEY"
          test -n "$EAS_PROJECT"
        env:
          SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EAS_PROJECT: ${{ vars.EXPO_PUBLIC_EAS_PROJECT_ID }}
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          target-branch: release-candidate
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-artifacts:
    needs: [verify, version]
    if: needs.version.outputs.released == 'true'
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/release-assets.yml
    with:
      tag: ${{ needs.version.outputs.tag }}
      # Reuse the current run only when its verified commit is the release.
      # Historical releases are rebuilt at their exact tag instead.
      build: ${{ needs.version.outputs.sha != github.sha }}
    secrets:
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
