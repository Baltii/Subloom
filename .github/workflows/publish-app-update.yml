name: Publish compatible mobile app update

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-mobile-update
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/release-candidate'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_EAS_PROJECT_ID: ${{ vars.EXPO_PUBLIC_EAS_PROJECT_ID }}
      EXPO_PUBLIC_PRO_LICENSE_PUBLIC_KEY: ${{ vars.EXPO_PUBLIC_PRO_LICENSE_PUBLIC_KEY }}
      EXPO_PUBLIC_PRO_PLAN_ENABLED: ${{ vars.EXPO_PUBLIC_PRO_PLAN_ENABLED || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Require an authorized Expo publishing token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: test -n "$EXPO_TOKEN" || { echo 'Configure EXPO_TOKEN for the existing EAS project before publishing mobile updates.' >&2; exit 1; }
      - run: npm ci
      - run: npm run check
      - name: Publish only to matching production runtimes
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npm run eas -- update --channel production --environment production --platform all --message "Production update $GITHUB_SHA" --non-interactive
