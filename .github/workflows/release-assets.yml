name: Attach release apps

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag to build (for example v1.4.0)
        type: string
        required: true
      verified_run_id:
        description: Optional successful production run at the release commit; reuse its verified apps
        type: string
        default: ''
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      reuse_verified:
        description: Reuse this run's already verified artifacts only at the same commit
        type: boolean
        default: false
      verified_run_id:
        description: Successful production run at the release commit
        type: string
        default: ''
    secrets:
      SUBLOOM_UPDATE_SIGNING_SEED:
        required: true
      GOOGLE_SERVICES_JSON:
        required: false

permissions:
  contents: read
  actions: read

concurrency:
  group: release-assets-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  source:
    name: Resolve the published production release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      tag: ${{ steps.source.outputs.tag }}
      artifacts_run_id: ${{ steps.source.outputs.artifacts_run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: release-candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Resolve and validate release source
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          REUSE_ARTIFACTS: ${{ inputs.reuse_verified == true }}
          VERIFIED_RUN_ID: ${{ inputs.verified_run_id }}
        run: |
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process';
          import { appendFileSync } from 'node:fs';
          import { assertVerifiedArtifactRun } from './scripts/release-publication.mts';
          const run = (command, args) => execFileSync(command, args, { encoding: 'utf8' }).trim();
          const tag = process.env.RELEASE_TAG;
          if (!/^v\d+\.\d+\.\d+$/.test(tag)) throw new Error('Use a stable vX.Y.Z release tag.');
          const release = JSON.parse(run('gh', ['release', 'view', tag, '--repo', process.env.GITHUB_REPOSITORY, '--json', 'tagName,isDraft,isPrerelease']));
          if (release.isDraft || release.isPrerelease || release.tagName !== tag) throw new Error('Expected a published stable release.');
          const sha = run('git', ['rev-parse', `refs/tags/${tag}^{commit}`]);
          run('git', ['merge-base', '--is-ancestor', sha, 'origin/release-candidate']);
          const manifest = JSON.parse(run('git', ['show', `${sha}:package.json`]));
          if (`v${manifest.version}` !== tag) throw new Error('Release tag and app version differ.');
          if (process.env.REUSE_ARTIFACTS === 'true' && sha !== process.env.GITHUB_SHA) throw new Error('Cannot attach binaries verified at a different commit.');
          let artifactsRun = '';
          if (process.env.VERIFIED_RUN_ID) {
            artifactsRun = process.env.VERIFIED_RUN_ID;
            if (!/^\d+$/.test(artifactsRun)) throw new Error('Use a numeric verified run ID.');
            const repository = process.env.GITHUB_REPOSITORY;
            const info = JSON.parse(run('gh', ['api', `repos/${repository}/actions/runs/${artifactsRun}`]));
            const artifacts = JSON.parse(run('gh', ['api', `repos/${repository}/actions/runs/${artifactsRun}/artifacts?per_page=100`]));
            assertVerifiedArtifactRun(info, repository, sha, artifacts.artifacts);
          } else if (process.env.REUSE_ARTIFACTS === 'true') artifactsRun = process.env.GITHUB_RUN_ID;
          appendFileSync(process.env.GITHUB_OUTPUT, `sha=${sha}\ntag=${tag}\nartifacts_run_id=${artifactsRun}\n`);
          JS

  verify:
    needs: source
    if: needs.source.outputs.artifacts_run_id == ''
    uses: ./.github/workflows/verify.yml
    with:
      ref: ${{ needs.source.outputs.sha }}
    secrets:
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}

  publish:
    name: Attach installers and checksums
    needs: [source, verify]
    if: >-
      always() && needs.source.result == 'success' &&
      (needs.verify.result == 'success' ||
       (needs.verify.result == 'skipped' && needs.source.outputs.artifacts_run_id != ''))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Download verified apps from the validated release run
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACTS_RUN_ID: ${{ needs.source.outputs.artifacts_run_id || github.run_id }}
        run: |
          for artifact in android-apk windows-x64 macos-arm64 macos-x64; do
            gh run download "$ARTIFACTS_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$artifact" --dir "artifacts/$artifact"
          done
      - name: Verify all platform checksums
        run: |
          for artifact in android-apk windows-x64 macos-arm64 macos-x64; do
            (cd "artifacts/$artifact" && sha256sum --check ./*.sha256)
          done
      - name: Sign complete release metadata with the installed app's trust key
        env:
          RELEASE_TAG: ${{ needs.source.outputs.tag }}
          RELEASE_SHA: ${{ needs.source.outputs.sha }}
          SUBLOOM_UPDATE_SIGNING_SEED: ${{ secrets.SUBLOOM_UPDATE_SIGNING_SEED }}
        run: node scripts/prepare-update-release.mjs
      - name: Attach platform downloads before publishing update feeds
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.source.outputs.tag }}
          RELEASE_SHA: ${{ needs.source.outputs.sha }}
        run: |
          gh release upload "$RELEASE_TAG" artifacts/android-apk/* artifacts/windows-x64/* artifacts/macos-arm64/* artifacts/macos-x64/* --repo "$GITHUB_REPOSITORY" --clobber
          gh release upload "$RELEASE_TAG" artifacts/updates/* --repo "$GITHUB_REPOSITORY" --clobber
          echo "Attached Android APK, Windows x64 installer and both Mac apps from $RELEASE_SHA to $RELEASE_TAG." >> "$GITHUB_STEP_SUMMARY"
