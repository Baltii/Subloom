name: Verify app, website and installable artifacts

on:
  workflow_call:
    inputs:
      ref:
        description: Exact source commit to verify and package
        type: string
        default: ''
      run_landing:
        description: Whether to build the landing website
        type: boolean
        default: true
      run_native:
        description: Whether to verify the app and native installers
        type: boolean
        default: true
    secrets:
      GOOGLE_SERVICES_JSON:
        description: Firebase Android client configuration
        required: false

permissions:
  contents: read

jobs:
  app:
    if: ${{ inputs.run_native }}
    name: App, database and backend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Validate GitHub workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - run: npm run check
      - run: npm run test:windows
      - run: node scripts/build-brand.mjs --check
      - run: npm run check:backend
      - run: npm run test:backend
      - name: Export web and native JavaScript bundles
        run: |
          node scripts/expo.mjs export --platform all --output-dir build/ci-bundles
          node scripts/expo.mjs config --type public --json > build/expo-config.json
          node -e 'const assert = require("node:assert/strict"); assert.equal(require("./build/expo-config.json").version, require("./package.json").version)'
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_EAS_PROJECT_ID: ${{ vars.EXPO_PUBLIC_EAS_PROJECT_ID }}
          EXPO_PUBLIC_PRO_LICENSE_PUBLIC_KEY: ${{ vars.EXPO_PUBLIC_PRO_LICENSE_PUBLIC_KEY }}

  macos:
    if: ${{ inputs.run_native }}
    name: Mac build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Select installed Xcode
        run: echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"
      - name: Test native workspace persistence and bridge origins
        run: npm run test:macos:storage
      - name: Compile and verify signed Mac test app
        run: npm run build:macos
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_EAS_PROJECT_ID: ${{ vars.EXPO_PUBLIC_EAS_PROJECT_ID }}
          EXPO_PUBLIC_PRO_LICENSE_PUBLIC_KEY: ${{ vars.EXPO_PUBLIC_PRO_LICENSE_PUBLIC_KEY }}
      - name: Package versioned test app
        run: |
          version=$(node -p 'require("./package.json").version')
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' build/Subloom.app/Contents/Info.plist)" = "$version"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' build/Subloom.app/Contents/Info.plist)" = "$version"
          ditto -c -k --sequesterRsrc --keepParent build/Subloom.app "build/Subloom-${version}-macos-${ARCH}.zip"
          cd build
          shasum -a 256 "Subloom-${version}-macos-${ARCH}.zip" > "Subloom-${version}-macos-${ARCH}.sha256"
        env:
          ARCH: ${{ matrix.arch }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-${{ matrix.arch }}
          path: |
            build/Subloom-*-macos-*.zip
            build/Subloom-*-macos-*.sha256
          if-no-files-found: error
          retention-days: 14

  landing:
    if: ${{ inputs.run_landing }}
    name: Landing production build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: landing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: landing/package-lock.json
      - run: npm ci
      - run: npm run build

  android:
    if: ${{ inputs.run_native }}
    name: Android APK
    needs: app
    uses: ./.github/workflows/android-apk.yml
    with:
      ref: ${{ inputs.ref }}
    secrets:
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}

  windows:
    if: ${{ inputs.run_native }}
    name: Windows installer
    uses: ./.github/workflows/windows-exe.yml
    with:
      ref: ${{ inputs.ref }}
