name: Build Windows installer

on:
  workflow_call:
    inputs:
      ref:
        description: Exact source commit to build
        type: string
        default: ""
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer:
    name: Windows x64 installer
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_EAS_PROJECT_ID: ${{ vars.EXPO_PUBLIC_EAS_PROJECT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            windows/package-lock.json
      - name: Require public app configuration
        shell: bash
        run: |
          test -n "$EXPO_PUBLIC_SUPABASE_URL"
          test -n "$EXPO_PUBLIC_SUPABASE_ANON_KEY"
      - run: npm ci
      - run: npm --prefix windows ci
      - run: npm run test:windows
      - run: npm run build:windows
      - name: Install, reinstall and verify workspace persistence and process detection
        run: npm run test:windows:app
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-x64
          path: |
            build/windows/Subloom-*-windows-x64-setup.exe
            build/windows/Subloom-*-windows-x64-setup.exe.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Explain Windows download
        shell: bash
        run: |
          echo '### Windows x64 installer' >> "$GITHUB_STEP_SUMMARY"
          echo 'Download the installer and SHA-256 checksum from windows-x64. This build is unsigned; Windows may show an unknown-publisher warning.' >> "$GITHUB_STEP_SUMMARY"
